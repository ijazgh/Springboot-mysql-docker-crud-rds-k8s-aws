services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: javatechie
      MYSQL_USER: springapp
      MYSQL_PASSWORD: local-learning-only
      MYSQL_ROOT_PASSWORD: local-root-learning-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql-local:
